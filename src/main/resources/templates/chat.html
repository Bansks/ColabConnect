<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — ColabConnect</title>
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <script src="/webjars/sockjs-client/sockjs.min.js"></script>
  <script src="/webjars/stomp-websocket/stomp.min.js"></script>
  <style>
    .chat-layout { display:flex; height:100%; overflow:hidden; }

    /* Sidebar */
    .chat-sidebar { width:260px; min-width:220px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .chat-sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border); }
    .chat-sidebar-title { font-size:14px; font-weight:700; color:var(--text-primary); }
    .chat-sidebar-sub { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .chat-list { flex:1; overflow-y:auto; }
    .chat-section-label { padding:10px 16px 4px; font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.6px; }
    .chat-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; border-left:3px solid transparent; transition:background .12s; }
    .chat-item:hover { background:var(--hover-bg); }
    .chat-item.active { background:rgba(98,100,167,.15); border-left-color:var(--teams-purple); }
    .chat-item-icon { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--teams-purple),#8385c7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
    .chat-item-icon.project { border-radius:8px; font-size:16px; }
    .chat-item-info { flex:1; min-width:0; }
    .chat-item-name { font-size:13px; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-item-preview { font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-item-dot { width:8px; height:8px; background:var(--teams-purple); border-radius:50%; flex-shrink:0; }

    /* Main chat area */
    .chat-main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-primary); }
    .chat-header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:var(--bg-primary); }
    .chat-header-icon { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--teams-purple),#8385c7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
    .chat-header-icon.project { border-radius:8px; font-size:18px; }
    .chat-header-name { font-size:15px; font-weight:700; color:var(--text-primary); }
    .chat-header-sub { font-size:12px; color:var(--text-muted); }
    .chat-header-badge { margin-left:auto; }

    .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; }
    .msg-group { display:flex; gap:10px; margin-bottom:14px; align-items:flex-start; }
    .msg-group.own { flex-direction:row-reverse; }
    .msg-avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--teams-purple),#4a4d8a); color: #13aaea; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
    .msg-group.own .msg-avatar { background:linear-gradient(135deg,#3a7ebf,#1a5fa0); }
    .msg-body { max-width:65%; }
    .msg-meta { display:flex; align-items:baseline; gap:6px; margin-bottom:3px; }
    .msg-group.own .msg-meta { flex-direction:row-reverse; }
    .msg-sender { font-size:12px; font-weight:700; color:var(--text-primary); }
    .msg-time { font-size:11px; color:var(--text-muted); }
    .msg-bubble { background:var(--bg-secondary); border-radius:0 8px 8px 8px; padding:8px 12px; font-size:13px; line-height:1.5; color:var(--text-primary); word-break:break-word; }
    .msg-group.own .msg-bubble { background:var(--teams-purple); color:#fff; border-radius:8px 0 8px 8px; }
    .date-divider { display:flex; align-items:center; gap:12px; margin:10px 0; color:var(--text-muted); font-size:11px; }
    .date-divider::before,.date-divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* Footer */
    .chat-footer { padding:10px 20px 14px; border-top:1px solid var(--border); background:var(--bg-primary); }
    .guest-warning { background:linear-gradient(135deg,#fff3cd,#fff8e1); border:1px solid #ffc107; border-radius:8px; padding:10px 14px; margin-bottom:10px; display:flex; align-items:flex-start; gap:8px; font-size:12px; color:#856404; }
    .guest-blocked { background:#f8f0ff; border:1px solid var(--teams-purple); border-radius:8px; padding:12px 16px; text-align:center; font-size:13px; color:var(--teams-purple); }
    .guest-blocked a { color:var(--teams-purple); font-weight:700; }
    .chat-input-row { display:flex; gap:10px; align-items:flex-end; }
    .chat-input { flex:1; border:1.5px solid var(--border); border-radius:8px; padding:10px 14px; font-size:13px; font-family:inherit; resize:none; background:var(--bg-primary); color:var(--text-primary); min-height:42px; max-height:120px; outline:none; transition:border-color .15s; }
    .chat-input:focus { border-color:var(--teams-purple); }
    .chat-input:disabled { background:var(--bg-secondary); color:var(--text-muted); cursor:not-allowed; }
    .chat-send-btn { width:42px; height:42px; background:var(--teams-purple); color:white; border:none; border-radius:8px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
    .chat-send-btn:hover { background:#4a4d8a; }
    .chat-send-btn:disabled { background:#ccc; cursor:not-allowed; }

    .chat-empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); padding:40px; text-align:center; }
    .chat-empty-icon { font-size:56px; margin-bottom:12px; }
    .chat-empty-title { font-size:18px; font-weight:700; color:var(--text-primary); margin-bottom:6px; }
    .chat-empty-sub { font-size:13px; max-width:280px; }

    /* Tasks panel layout */
    .chat-tasks-panel { width: 320px; min-width: 320px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .chat-tasks-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .chat-tasks-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .chat-tasks-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .task-category { display: flex; flex-direction: column; }
    .task-section-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    
    .task-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 0.15s; position: relative; }
    .task-card:hover { box-shadow: var(--shadow-sm); }
    .task-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .task-checkbox { width: 16px; height: 16px; margin-top: 2px; cursor: pointer; }
    .task-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; word-break: break-word; }
    .task-title.completed { text-decoration: line-through; color: var(--text-muted); }
    
    .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .task-priority { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; }
    .task-priority.high { background: #fde7e9; color: var(--danger); }
    .task-priority.medium { background: #fff3e0; color: var(--warning); }
    .task-priority.low { background: #e6f4ea; color: var(--success); }
    
    .task-due { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
    .task-assignee { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    
    .task-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--border); }
  </style>
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{layout :: left-panel}"></div>
  <div class="main-content" style="padding:0;overflow:hidden;display:flex;flex-direction:column;">
    <div class="chat-layout">

      <!-- Sidebar -->
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <div class="chat-sidebar-title"><box-icon name="message-square" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px;"></box-icon> Messages</div>
          <div class="chat-sidebar-sub">Direct &amp; project chats</div>
        </div>
        <div class="chat-list" id="chat-list">
          <div style="padding:20px;color:var(--text-muted);font-size:12px;">Loading...</div>
        </div>
      </div>

      <!-- Main -->
      <div class="chat-main" id="chat-main">
        <div class="chat-empty-state">
          <div class="chat-empty-icon"><box-icon name="message-square" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px;"></box-icon></div>
          <div class="chat-empty-title">Select a conversation</div>
          <div class="chat-empty-sub">Choose a direct message or project chat from the left panel</div>
        </div>
      </div>

      <!-- Tasks Panel (Collapsible, for project chats only) -->
      <div class="chat-tasks-panel" id="chat-tasks-panel" style="display:none;">
        <div class="chat-tasks-header">
          <div class="chat-tasks-title">
            <box-icon name="list-check" color="currentColor" style="width: 18px; height: 18px; vertical-align: middle;"></box-icon> Project Tasks
          </div>
          <button class="btn-icon" onclick="toggleTasksPanel()"><box-icon name="x" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
        </div>
        <div class="chat-tasks-body">
          <button id="add-task-trigger-btn" class="btn btn-primary btn-full btn-sm" onclick="openCreateTaskModal()" style="display:none; margin-bottom:12px;">+ Add Task</button>
          
          <div class="task-category" id="category-pending-container">
            <div class="task-section-title">Pending</div>
            <div id="tasks-list-pending" style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
          </div>

          <div class="task-category" id="category-inprogress-container">
            <div class="task-section-title">In Progress</div>
            <div id="tasks-list-inprogress" style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
          </div>

          <div class="task-category" id="category-done-container">
            <div class="task-section-title">Completed</div>
            <div id="tasks-list-done" style="display:flex; flex-direction:column; gap:8px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Create Task Modal -->
<div class="modal-overlay" id="create-task-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Create Project Task</div>
      <button class="btn-icon" onclick="closeModal('create-task-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <div id="create-task-error" style="display:none;" class="error-msg mb-16"></div>
      <div class="form-group">
        <label class="form-label">Task Title *</label>
        <input type="text" id="task-title-input" class="form-input" placeholder="e.g. Implement WebSocket Handshake" max="200" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <textarea id="task-desc-input" class="form-textarea" placeholder="Add detailed notes or requirements..." max="2000"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Assignee *</label>
          <select id="task-assignee-select" class="form-select" required>
            <option value="">Choose team member...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select id="task-priority-select" class="form-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Due Date (optional)</label>
        <input type="date" id="task-duedate-input" class="form-input">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('create-task-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createProjectTask()" id="task-create-confirm-btn">Create Task</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=6"></script>
<script src="/js/chat.js?v=6"></script>
<div th:replace="~{layout :: project-modal}"></div>
</body>
</html>
